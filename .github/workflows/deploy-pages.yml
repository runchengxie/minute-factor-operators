name: Deploy factor research site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build demo snapshot
        run: python scripts/build_factor_snapshot.py --demo --output site/public/data/factor-snapshot.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install frontend dependencies
        working-directory: site
        run: npm ci
      - name: Build frontend
        working-directory: site
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Support direct route loads on Pages
        run: cp site/dist/index.html site/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
